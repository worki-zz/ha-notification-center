[project]
name = "ha-notification-center"
version = "0.0.1"
description = "Notification Center: one place for every notification of your Home Assistant home."
requires-python = ">=3.14.2"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "C4", "D", "E", "F", "I", "N", "PERF", "PL", "PT",
  "RET", "RUF", "SIM", "UP", "W",
]
ignore = [
  "D202",    # blank line after function docstring
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
ignore_missing_imports = true
explicit_package_bases = true

# Home Assistant re-exports names without listing every one in __all__.
[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
