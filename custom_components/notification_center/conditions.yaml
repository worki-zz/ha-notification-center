notification_state:
  fields:
    notification: &notification
      required: false
      selector:
        entity:
          filter:
            integration: notification_center
            domain: sensor
    step:
      required: false
      selector:
        number:
          min: 1
          max: 20
          mode: box
    state:
      required: true
      selector:
        select:
          translation_key: notification_state
          options:
            - active
            - done
            - snoozed
            - dismissed
    for: &for
      required: false
      selector:
        duration:
    within:
      required: false
      selector:
        duration:

listed_entities:
  fields:
    notification: *notification
    to:
      required: false
      selector:
        text:
          multiple: true
    not_to:
      required: false
      selector:
        text:
          multiple: true
    above:
      required: false
      selector:
        number:
          mode: box
          step: any
    below:
      required: false
      selector:
        number:
          mode: box
          step: any
    attribute:
      required: false
      selector:
        text:
    for: *for
