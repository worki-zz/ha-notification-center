notification_state:
  fields:
    notification: &notification
      required: false
      selector:
        entity:
          filter:
            integration: notification_center
            domain: sensor
    step: &step
      required: false
      selector:
        number:
          min: 1
          max: 20
          mode: box
    state:
      required: true
      selector:
        select:
          translation_key: notification_state
          options:
            - active
            - done
            - snoozed
            - dismissed
    for: &for
      required: false
      selector:
        duration:

entities_state:
  fields:
    notification: &entities_notification
      required: true
      selector:
        entity:
          filter:
            integration: notification_center
            domain: sensor
    attribute: &attribute
      required: false
      selector:
        text:
    to:
      required: false
      selector:
        text:
          multiple: true
    not_to:
      required: false
      selector:
        text:
          multiple: true
    for: *for

entities_numeric_state:
  fields:
    notification: *entities_notification
    attribute: *attribute
    above: &above
      required: false
      selector:
        text:
    below: *above
    value_template:
      required: false
      selector:
        template:
    for: *for
