name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: custom_components/notification_center/frontend/*.js
          if-no-files-found: error

  python:
    name: Python
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: custom_components/notification_center/frontend
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install -r requirements_test.txt
      - run: python scripts/check_version.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components tests
      - run: pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Not listed in the Home Assistant brands repository.
          ignore: brands
