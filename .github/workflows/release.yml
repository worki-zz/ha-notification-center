name: Release

# Start it from the Actions tab (or the API) with a version such as 0.0.1.
# It checks the versions, builds the zip, and creates the tag and the GitHub
# release with the matching CHANGELOG section as its notes.
# A release published by hand on GitHub also gets the zip attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (for example 0.0.1)
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build notification_center.zip and publish the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check that the tag matches the versions
        run: python scripts/check_version.py "$TAG"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Create the zip
        working-directory: custom_components/notification_center
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          zip -r "$GITHUB_WORKSPACE/dist/notification_center.zip" . -x "__pycache__/*" "*.pyc"
      - name: Create the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$TAG" dist/notification_center.zip \
            --target "$GITHUB_SHA" --title "$version" --notes-file dist/notes.md
      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/notification_center.zip --clobber
